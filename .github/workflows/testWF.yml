name: TC3-WFM-Docker-Sanity
on:
  workflow_dispatch:
jobs:
  wfm-sanity:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      # Branches
      SYMPHONY_BRANCH: sanity-suite
      SANDBOX_REPO_BRANCH: sanity-suite-1
      # Ports
      EXPOSED_HARBOR_PORT: 8081
      EXPOSED_SYMPHONY_PORT: 8082
      # Optional GitHub auth
      GITHUB_USER: ""
      GITHUB_TOKEN: ""
      APP_PACKAGE_NAME: nextcloud-compose-app-package
    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
      # ============================================================
      # Detect runner IP (NOT localhost)
      # ============================================================
      - name: Detect runner IP
        run: |
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "✅ Runner IP: $RUNNER_IP"
      # ============================================================
      # OS prerequisites (NO docker install)
      # ============================================================
      - name: Install OS dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            curl \
            jq \
            netcat-openbsd \
            openssl \
            git
      # ============================================================
      # Docker sanity & permissions (CRITICAL)
      # ============================================================
      - name: Docker sanity check
        run: |
          docker --version
          docker compose version || true
          sudo systemctl start docker
          sudo chmod 666 /var/run/docker.sock
          sudo docker ps
          sudo docker network prune -f
      # ============================================================
      # Make pipeline scripts executable
      # ============================================================
      - name: Make scripts executable
        run: chmod +x pipeline/*.sh
      # ============================================================
      # Generate wfm.env (MANDATORY)
      # ============================================================
      - name: Generate wfm.env
        run: |
          cat > pipeline/wfm.env <<EOF
          CI=true
          EXPOSED_HARBOR_IP=${RUNNER_IP}
          EXPOSED_SYMPHONY_IP=${RUNNER_IP}
          EXPOSED_HARBOR_PORT=${EXPOSED_HARBOR_PORT}
          EXPOSED_SYMPHONY_PORT=${EXPOSED_SYMPHONY_PORT}
          SYMPHONY_BRANCH=${SYMPHONY_BRANCH}
          SANDBOX_REPO_BRANCH=${SANDBOX_REPO_BRANCH}
          GITHUB_USER=${GITHUB_USER}
          GITHUB_TOKEN=${GITHUB_TOKEN}
          APP_PACKAGE_NAME=${APP_PACKAGE_NAME}
          EOF
          echo "✅ wfm.env generated"
          cat pipeline/wfm.env
      # ============================================================
      # WFM install (clones Symphony)
      # ============================================================
      - name: WFM install
        working-directory: pipeline
        run: |
          echo "▶️ Installing WFM / Symphony"
          sudo -E bash ./wfm.sh install
      # ============================================================
      # Start Symphony
      # ============================================================
      - name: Start Symphony
        working-directory: pipeline
        run: |
          echo "▶️ Starting Symphony"
          sudo -E bash ./wfm.sh start
          sleep 40
          sudo docker ps
          sleep 10
      # ------------------------------------------------
      # Wait for CA certificate
      # ------------------------------------------------
      - name: Wait for Symphony CA cert
        run: |
          CERT="$HOME/symphony/api/certificates/ca-cert.pem"
          for i in {1..30}; do
            [ -f "$CERT" ] && break
            echo "⏳ Waiting for CA cert..."
            sleep 5
          done
          if [ ! -f "$CERT" ]; then
            echo "❌ CA certificate not found"
            exit 1
          fi
          mkdir -p "$HOME/certs"
          cp "$CERT" "$HOME/certs/"
          echo "✅ CA cert ready"
     
      # ============================================================
      # Wait for Harbor
      # ============================================================
      - name: Login and Pull OCI Artifact
        run: |
          echo "📥 Preparing Docker config..."
          export DOCKER_CONFIG=$(mktemp -d)
          echo "📥 Logging into Harbor at ${{ env.RUNNER_IP }}:${{ env.EXPOSED_HARBOR_PORT }}"
          echo "${{ secrets.HARBOR_PASSWORD }}" | oras login \
            ${{ env.RUNNER_IP }}:${{ env.EXPOSED_HARBOR_PORT }} \
            -u admin --password-stdin --plain-http
          echo "📥 Pulling artifact..."
          mkdir -p pulled-package
          cd pulled-package
          oras pull \
            ${{ env.RUNNER_IP }}:${{ env.EXPOSED_HARBOR_PORT }}/library/${{ env.APP_PACKAGE_NAME }}:latest \
            --plain-http
          echo "📦 Pulled files:"
          ls -R
      
      - name: Verify OCI Manifest Type
        run: |
                  echo "🔍 Verifying OCI image manifest..."
                  curl -sI \
                    -u admin:${{ secrets.HARBOR_PASSWORD }} \
                    -H "Accept: application/vnd.oci.image.manifest.v1+json" \
                  http://${{ env.RUNNER_IP }}:${{ env.EXPOSED_HARBOR_PORT }}/v2/library/${{ env.APP_PACKAGE_NAME }}/manifests/latest
      # ============================================================
      # Docker Device Agent
      # ============================================================
      - name: Device Agent (Docker) – prerequisites
        working-directory: pipeline
        run: |
          cat > device-agent.env <<EOF
          WFM_IP=${RUNNER_IP}
          EXPOSED_HARBOR_IP=registry
          EOF
          sudo -E bash ./device-agent.sh docker install
      - name: Device Agent (Docker) – create certs
        working-directory: pipeline
        run: |
          sudo -E bash ./device-agent.sh docker create-rsa-certs
          sudo -E bash ./device-agent.sh docker create-ecdsa-certs
      - name: Device Agent (Docker) – start
        working-directory: pipeline
        run: |
          sudo -E bash ./device-agent.sh docker start-docker
          sleep 20
      - name: Device Agent (Docker) – status
        working-directory: pipeline
        run: |
          sudo -E bash ./device-agent.sh docker status
      # ============================================================
      - name: docker logs check
        run: |         
          sudo docker ps -a
          echo "------ LOGS ------"
          sudo docker logs symphony-api-container --tail=20 || true
      
      # ============================================================
      # Cleanup FAILED package (idempotent)
      # ============================================================
      - name: Delete existing app package if present
        working-directory: pipeline
        run: |
          echo "🧹 Deleting existing package if any"
          sudo -E bash ./wfm-cli.sh delete-package ${APP_PACKAGE_NAME} || true

        
      # ============================================================
      # Upload app package - FIXED version
      # ============================================================
     
      - name: Upload Nextcloud app package (corrected)
        working-directory: pipeline
        run: |
          echo "📤 Uploading to WFM..."
          set -x  # Enable debug output
          
          # Verify package is in Harbor before upload
          echo "🔍 Verifying package exists in Harbor..."
          curl -s -u admin:Harbor12345 \
            "http://localhost:8081/api/v2.0/projects/library/repositories/${APP_PACKAGE_NAME}/artifacts" \
            | jq '.[] | {name: .name, tags: .tags}' || echo "Failed to query package"
          
          sudo -E bash ./wfm-cli.sh upload-app ${APP_PACKAGE_NAME}

          sudo docker ps -a
          sleep 15
          echo "------WFM LOGS ------"
          sudo docker logs symphony-api-container --tail=1000 || true
          
          
      # ============================================================
      - name: Test internal registry from Symphony container
        run: |
          echo "🔎 Testing registry:5000 from Symphony container..."
          sudo docker exec symphony-api-container sh -c "
            echo 'DNS resolution test:' &&
            getent hosts registry || echo 'DNS failed' &&
            echo 'Registry API test:' &&
            wget -S -qO- http://registry:5000/v2/ || echo 'Registry unreachable'
              "

      - name: Test manifest via internal registry
        run: |
          echo "🔎 Testing manifest via registry:5000..."
          sudo docker exec symphony-api-container sh -c "
            wget -S -qO- \
          http://registry:5000/v2/library/nextcloud-compose-app-package/manifests/latest \
              || echo 'Manifest fetch failed'
            "
              
      - name: Show docker networks
        run: |
          docker network ls
          echo "------"
          sudo docker inspect symphony-api-container | jq '.[0].NetworkSettings.Networks'
         
      # ============================================================
      # List  app package
      # ============================================================
      - name: List  all
        working-directory: pipeline
        run: |
          echo "📋 Listing all app packages/devices..."
          sudo -E bash ./wfm-cli.sh list-all
          sleep 15
          echo "📋 Listing app packages..."
          sudo -E bash ./wfm-cli.sh list-packages
      # ============================================================
      # Check for onboarding errors in Symphony logs
      # ============================================================
      # - name: Capture Symphony onboarding errors
      #   run: |
      #     echo "🔍 Checking Symphony logs for onboarding errors..."
      #     echo ""
          
      #     # Search for error patterns in Symphony logs
      #     echo "❌ Searching for ERROR patterns..."
      #     docker logs symphony-api-container 2>&1 | grep -i "error\|fail\|onboard" | tail -20 || echo "No error patterns found"
          
      #     echo ""
      #     echo "⚠️ Searching for WARN patterns..."
      #     docker logs symphony-api-container 2>&1 | grep -i "warn" | tail -10 || echo "No warn patterns found"
          
      #     echo ""
      #     echo "🔎 Full Symphony logs (last 100 lines)..."
      #     docker logs --tail 100 symphony-api-container 2>&1
      