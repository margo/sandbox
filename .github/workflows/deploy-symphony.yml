name: Deploy Symphony Application

on:
  # Trigger on push to main branch
  push:
    branches: [ main, githib-actions ]

  workflow_dispatch:
  # Trigger on pull request
  pull_request:
    branches: [ main ]
  

env:
  VM_HOST: "52.224.241.180"
  VM_USER: "azureuser"
  VM_PASS: "Margo@123456"  
    

jobs:
  install_symphony:
    name: Symphony Install via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Check and install Go and Rust
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          password: ${{ env.VM_PASS }}
          port: 22
          script: |
            # Install Go if not present
            if ! command -v go &> /dev/null; then
              sudo apt update -y
              sudo apt install golang-go -y
            else
              echo "Go already installed."
            fi
            # Install Rust if not present
            if ! command -v cargo &> /dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env
            else
              echo "Rust already installed."
            fi

      - name: Clone or update Symphony repository
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          password: ${{ env.VM_PASS }}
          port: 22
          script: |
            if [ ! -d "$HOME/symphony/.git" ]; then
              git clone https://github.com/eclipse-symphony/symphony.git
            else
              cd $HOME/symphony
              git pull
              echo "Symphony repo updated."
            fi

      - name: Build native Rust library
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          password: ${{ env.VM_PASS }}
          port: 22
          script: |
            source $HOME/.cargo/env
            cd ~/symphony/api/pkg/apis/v1alpha1/providers/target/rust
            # Only build if the output does not exist or is older than the source
            if [ ! -f target/release/libsymphony_provider.so ] || [ $(find src -type f -newer target/release/libsymphony_provider.so | wc -l) -gt 0 ]; then
              cargo build --release
              echo "Rust library built."
            else
              echo "Rust library is up-to-date, skipping build."
            fi

      - name: Build symphony-api Go binary
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          password: ${{ env.VM_PASS }}
          port: 22
          script: |
            export LD_LIBRARY_PATH=$HOME/symphony/api/pkg/apis/v1alpha1/providers/target/rust/target/release
            cd ~/symphony/api
            go build -o symphony-api

      - name: Run symphony-api in background
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          password: ${{ env.VM_PASS }}
          port: 22
          script: |
            cd ~/symphony/api
            nohup SYMPHONY_API_URL="http://localhost:8082/v1alpha2/" USE_SERVICE_ACCOUNT_TOKENS="false" ./symphony-api -c ./symphony-api-no-k8s.json -l Debug > symphony-api.log 2>&1 &
            echo "symphony-api started in background."
