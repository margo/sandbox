name: Security Analysis

on:
  push:
    branches: [ chore/fix-scan-findings ]
  pull_request:
    branches: [ chore/fix-scan-findings ]

jobs:
  security-analysis:
    name: CodeQL + Go Dependency Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------
      # Set up Go
      # -------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      # -------------------------------
      # Install dependencies
      # -------------------------------
      - name: Install Dependencies
        run: go mod download

      # -------------------------------
      # CodeQL Analysis
      # -------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # -------------------------------
      # Go Vulnerability Scan
      # -------------------------------
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (PRINT + SAVE)
        run: |
          echo "===== Running Go Vulnerability Scan ====="
          govulncheck ./... | tee govulncheck-report.txt

      # -------------------------------
      # Upload report (optional download)
      # -------------------------------
      - name: Upload govulncheck report
        uses: actions/upload-artifact@v4
        with:
          name: go-vulnerability-report
          path: govulncheck-report.txt