name: E2E-WFM-Agent-Sanity
on:
 workflow_dispatch:
jobs:
 wfm-sanity:
   runs-on: ubuntu-latest
   env:
     CI: "true"
     SYMPHONY_BRANCH: sanity-suite
     SANDBOX_REPO_BRANCH: sanity-suite-1
     EXPOSED_HARBOR_PORT: 8081
     EXPOSED_SYMPHONY_PORT: 8082
     GITHUB_USER: ""
     GITHUB_TOKEN: ""
     APP_PACKAGE_NAME: nextcloud-compose-app-package
   steps:
   # ============================================================
   # Checkout
   # ============================================================
   - name: Checkout repository
     uses: actions/checkout@v4
   # ============================================================
   # Detect Runner IP (dynamic every run)
   # ============================================================
   - name: Detect runner IP
     run: |
       RUNNER_IP=$(hostname -I | awk '{print $1}')
       echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
       echo "✅ Runner IP: $RUNNER_IP"
   # ============================================================
   # Install OS Dependencies
   # ============================================================
   - name: Install dependencies
     run: |
       sudo apt-get update -y
       sudo apt-get install -y curl jq netcat-openbsd openssl git lsof
   # ============================================================
   # Docker Sanity
   # ============================================================
   - name: Docker sanity
     run: |
       docker --version
       docker compose version || true
       sudo systemctl start docker
       sudo chmod 666 /var/run/docker.sock
       sudo docker ps
       sudo docker network prune -f
   # ============================================================
   # Make scripts executable
   # ============================================================
   - name: Make scripts executable
     run: chmod +x pipeline/*.sh
   # ============================================================
   # Generate wfm.env
   # ============================================================
   - name: Generate wfm.env
     run: |
       cat > pipeline/wfm.env <<EOF
       CI=true
       EXPOSED_HARBOR_IP=registry
       EXPOSED_SYMPHONY_IP=symphony-api-container
       EXPOSED_HARBOR_PORT=${EXPOSED_HARBOR_PORT}
       EXPOSED_SYMPHONY_PORT=${EXPOSED_SYMPHONY_PORT}
       SYMPHONY_BRANCH=${SYMPHONY_BRANCH}
       SANDBOX_REPO_BRANCH=${SANDBOX_REPO_BRANCH}
       GITHUB_USER=${GITHUB_USER}
       GITHUB_TOKEN=${GITHUB_TOKEN}
       APP_PACKAGE_NAME=${APP_PACKAGE_NAME}
       EOF
       echo "✅ wfm.env generated"
       cat pipeline/wfm.env
   # ============================================================
   # Install WFM (Harbor + Symphony)
   # ============================================================
   - name: WFM - Install
     working-directory: pipeline
     run: |
       sudo -E bash ./wfm.sh install
   
   # ============================================================
   # Start Symphony
   # ============================================================
   - name: Start Symphony
     working-directory: pipeline
     run: |
       sudo -E bash ./wfm.sh start
       sleep 40
       sudo docker ps
   # ============================================================
   # Test registry connectivity from Symphony container
   # ============================================================
   - name: Test Registry connectivity
     run: |
       sudo docker exec symphony-api-container sh -c "
         echo 'Registry test:' &&
         wget -S -qO- http://${RUNNER_IP}:${EXPOSED_HARBOR_REGISTRY_PORT}/v2/ || exit 1
       "
   # ============================================================
   # Verify OCI artifact
   # ============================================================
   - name: Verify OCI Artifact
     run: |
       export DOCKER_CONFIG=$(mktemp -d)
       echo "${{ secrets.HARBOR_PASSWORD }}" | oras login ${RUNNER_IP}:${EXPOSED_HARBOR_PORT} -u admin --password-stdin --plain-http
       mkdir -p pulled-package
       cd pulled-package
       oras pull ${RUNNER_IP}:${EXPOSED_HARBOR_PORT}/library/${APP_PACKAGE_NAME}:latest --plain-http
       ls -R
       curl -sI \
         -u admin:${{ secrets.HARBOR_PASSWORD }} \
         -H "Accept: application/vnd.oci.image.manifest.v1+json" \
         http://${RUNNER_IP}:${EXPOSED_HARBOR_PORT}/v2/library/${APP_PACKAGE_NAME}/manifests/latest
   # ============================================================
   # Cleanup old package entry
   # ============================================================
   - name: Delete existing package
     working-directory: pipeline
     run: |
       sudo -E bash ./wfm-cli.sh delete-package ${APP_PACKAGE_NAME} || true
   # ============================================================
   # Upload app package
   # ============================================================
   - name: Upload app package
     working-directory: pipeline
     run: |
       sudo -E bash ./wfm-cli.sh upload-app ${APP_PACKAGE_NAME}
       sleep 20
       sudo docker logs symphony-api-container --tail=300 || true
   # ============================================================
   # Check onboarding status
   # ============================================================
   - name: Check onboarding status
     run: |
       sleep 20
       RESPONSE=$(curl -s http://${RUNNER_IP}:${EXPOSED_SYMPHONY_PORT}/api/v1/packages)
       echo "$RESPONSE"
       STATUS=$(echo "$RESPONSE" | jq -r '.items[] | select(.name=="'${APP_PACKAGE_NAME}'") | .state')
       echo "Package state: $STATUS"
       if [ "$STATUS" = "FAILED" ]; then
         echo "❌ Package onboarding FAILED."
         exit 1
       fi
       if [ "$STATUS" = "ONBOARDED" ] || [ "$STATUS" = "SUCCEEDED" ]; then
         echo "✅ Package onboarding successful."
         exit 0
       fi
       echo "⚠️ Unknown state: $STATUS"
       exit 1
