logging:
  # Log level (e.g., DEBUG, INFO, WARN, ERROR, FATAL)
  level: DEBUG
database:
  dataDir: "/var/lib/margo/device-agent/data" # directory where databse data is stored.


# Device root identity — used for device identification.
# TODO: MIAF SUP (PR2) — in PR2, device identity is an X.509-SVID issued by the
# Margo Identity Service (MIS). The PKI/Random identity types below are PR1 concepts.
# Replace with SPIFFE ID + X.509-SVID when MIAF is implemented.

miaf:
  x509:
    certPath: "./config/identity/payload-cert.pem"  # SVID certificate
    keyPath: "./config/identity/payload-key.pem"    # Private key
  mis:
    endpoint: "https://mis.margo.org:9443"          # MIS service URL
    caPath: "./config/mis/https-ca.crt"             # CA certificate
    cacheInterval: 60                               # cache interval in seconds
    trustBundle:
      path: "./config/mis/trust-bundle.json"        # Default SPIFFE trust bundle in JWKS format (used if mis endpoint is not configured)
  authzPath: "./config/authorized.json"             # Authorized clients

wfm:
  sbiUrl: https://symphony.machine:8082/v1alpha2/margo #http://172.19.59.148:8082/v1alpha2/margo/sbi/v1

stateSeeking:
  # How frequently the agent attempts to seek for the desired state from wfm
  # in seconds
  interval: 15

# the workload-fleet-management-client architecture is kept in a way that it is capable of managing more than one runtimes
# but one client with multiple devices is not defined by Margo yet. For example: what would be the identification
# for the client and the device. Will WFM be aware of the client and devices? Etc...
# If this is needed please reach out to the Margo group and follow the formal approach of Margo for SUPs.
# For now, always keep one runtime in this section, and comment all other
runtimes:
  - type: KUBERNETES
    kubernetes:
      kubeconfigPath: /root/.kube/config
  # - type: DOCKER
  #   docker:
  #     url: unix:///var/run/docker.sock #http://localhost:8080 #unix://var/unix/socket
  #     tlsSkipVerification: true
  #     tls:
  #       cacertPath: null
  #       certPath: null
  #       keyPath: null

# Note: Auto-discovery of device capabilities is not defined and hence not implemented yet,
# hence you are supposed to provide the details
# in the file.
# Path to the capabilities file (required).
capabilities:
  readFromFile: ./config/capabilities.json
