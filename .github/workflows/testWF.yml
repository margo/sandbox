name: E2E-WFM-Agent-Sanity

on:
  workflow_dispatch:

jobs:
  wfm-sanity:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      SYMPHONY_BRANCH: sanity-suite
      SANDBOX_REPO_BRANCH: sanity-suite-1
      EXPOSED_HARBOR_PORT: 8081
      EXPOSED_SYMPHONY_PORT: 8082
      APP_PACKAGE_NAME: nextcloud-compose-app-package
      GITHUB_USER: ""
      GITHUB_TOKEN: ""

    steps:

    # ============================================================
    - name: Checkout repository
      uses: actions/checkout@v4

    # ============================================================
    - name: Detect runner IP
      run: |
        RUNNER_IP=$(hostname -I | awk '{print $1}')
        echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
        echo "✔ Using runner IP = $RUNNER_IP"

    # ============================================================
    - name: Install OS prerequisites
      run: |
        sudo apt-get update -y
        sudo apt-get install -y curl jq netcat-openbsd openssl git

    # ============================================================
    - name: Docker sanity
      run: |
        sudo systemctl start docker
        sudo chmod 666 /var/run/docker.sock
        docker ps

    # ============================================================
    - name: Make pipeline scripts executable
      run: chmod +x pipeline/*.sh

    # ============================================================
    # 🔥 CRITICAL FIX — FORCE HARBOR HOSTNAME = registry
    # ============================================================
    - name: Patch Harbor hostname in wfm.sh (critical fix)
      run: |
        echo "Patching Harbor hostname to 'registry' inside wfm.sh..."
        sed -i '/prepare base dir/ i \
echo "🔧 Forcing Harbor hostname to registry"; \
sed -i "s/^hostname:.*/hostname: registry/" $HARBOR_DIR/harbor.yml 2>/dev/null || true \
' pipeline/wfm.sh

    # ============================================================
    - name: Generate wfm.env
      run: |
        cat > pipeline/wfm.env <<EOF
        CI=true
        EXPOSED_HARBOR_IP=registry
        EXPOSED_SYMPHONY_IP=${RUNNER_IP}
        EXPOSED_HARBOR_PORT=${EXPOSED_HARBOR_PORT}
        EXPOSED_SYMPHONY_PORT=${EXPOSED_SYMPHONY_PORT}
        SYMPHONY_BRANCH=${SYMPHONY_BRANCH}
        SANDBOX_REPO_BRANCH=${SANDBOX_REPO_BRANCH}
        GITHUB_USER=${GITHUB_USER}
        GITHUB_TOKEN=${GITHUB_TOKEN}
        APP_PACKAGE_NAME=${APP_PACKAGE_NAME}
        EOF
        echo "Generated wfm.env:"
        cat pipeline/wfm.env

    # ============================================================
    - name: WFM - Install
      working-directory: pipeline
      run: sudo -E bash ./wfm.sh install

    # ============================================================
    - name: WFM - Start Symphony
      working-directory: pipeline
      run: |
        sudo -E bash ./wfm.sh start
        sleep 40
        docker ps

    # ============================================================
    - name: Validate Harbor API (host → Harbor)
      run: |
        echo "Testing Harbor manifest API on host..."
        curl -v \
          -H "Accept: application/vnd.oci.image.manifest.v1+json" \
          http://${{ env.RUNNER_IP }}:${{ env.EXPOSED_HARBOR_PORT }}/v2/library/${APP_PACKAGE_NAME}/manifests/latest || true

    # ============================================================
    - name: Copy WFM CA cert
      run: |
        CERT="$HOME/symphony/api/certificates/ca-cert.pem"
        for i in {1..30}; do
          [ -f "$CERT" ] && break
          echo "Waiting for CA cert..."
          sleep 5
        done
        mkdir -p "$HOME/certs"
        cp "$CERT" "$HOME/certs/"
        echo "Copied CA certificate."

    # ============================================================
    # Device Agent – Docker version
    # ============================================================
    - name: WFM-Client (Docker) – Prerequisites
      working-directory: pipeline
      run: |
        cat > device-agent.env <<EOF
        WFM_IP=${RUNNER_IP}
        EXPOSED_HARBOR_IP=registry
        EOF
        sudo -E bash ./device-agent.sh docker install

    # ============================================================
    - name: WFM-Client (Docker) – Create Certs
      working-directory: pipeline
      run: |
        sudo -E bash ./device-agent.sh docker create-rsa-certs
        sudo -E bash ./device-agent.sh docker create-ecdsa-certs

    # ============================================================
    - name: WFM-Client (Docker) – Start
      working-directory: pipeline
      run: |
        sudo -E bash ./device-agent.sh docker start-docker
        sleep 20

    # ============================================================
    - name: WFM-Client (Docker) – Status
      working-directory: pipeline
      run: sudo -E bash ./device-agent.sh docker status

    # ============================================================
    - name: Cleanup previous package
      working-directory: pipeline
      run: sudo -E bash ./wfm-cli.sh delete-package ${APP_PACKAGE_NAME} || true

    # ============================================================
    - name: Verify Harbor artifacts + Upload package
      working-directory: pipeline
      run: |
        echo "Checking Harbor repository..."
        curl -s \
          -u admin:${{ secrets.HARBOR_PASSWORD }} \
          "http://${{ env.RUNNER_IP }}:${{ env.EXPOSED_HARBOR_PORT }}/api/v2.0/projects/library/repositories/${APP_PACKAGE_NAME}/artifacts" \
          | jq '.'
        sudo -E bash ./wfm-cli.sh upload-app ${APP_PACKAGE_NAME}
        sleep 10
        docker logs symphony-api-container --tail=200 || true

    # ============================================================
    - name: List Packages / Devices
      working-directory: pipeline
      run: |
        sudo -E bash ./wfm-cli.sh list-all
        sudo -E bash ./wfm-cli.sh list-packages

    # ============================================================
    - name: Check Onboarding Status
      run: |
        echo "Checking package onboarding state..."
        RESPONSE=$(curl -s http://${{ env.RUNNER_IP }}:${{ env.EXPOSED_SYMPHONY_PORT }}/api/v1/packages)
        echo "$RESPONSE"
        STATUS=$(echo "$RESPONSE" | jq -r '.items[] | select(.name=="nextcloud-compose-app-package") | .state')
        echo "State: $STATUS"
        if [ "$STATUS" = "FAILED" ]; then exit 1; fi
        if [ "$STATUS" = "ONBOARDED" ] || [ "$STATUS" = "SUCCEEDED" ]; then exit 0; fi
        exit 1
