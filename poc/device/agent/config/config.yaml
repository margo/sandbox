logging:
  # Log level (e.g., DEBUG, INFO, WARN, ERROR, FATAL)
  level: DEBUG
database:
  dataDir: "/var/lib/margo/device-agent/data" # directory where databse data is stored.

miaf:
  x509:
    # X.509-SVID and intermediate chain used as the principal's client identity.
    # The file must be PEM-encoded (RFC 7468); the leaf URI SAN identifies the
    # principal, so no separate principal identity is required.
    svidWithIntermediatePath: "./config/identity/payload-cert.pem"

    # Private key matching the leaf SVID.
    # In installed mode, the operator supplies it. In enrolled mode, the platform
    # supplies the path to the principal's locally generated key.
    # The key must be unencrypted PKCS#8 PEM (RFC 5958); restrict file access.
    keyPath: "./config/identity/payload-key.pem"

  mis:
    # Initial HTTPS trust anchor(s) for MIS-hosted material.
    # Supply this statically out of band when the MIS certificate chain cannot
    # be validated using the system trust store. Certificates are PEM-encoded.
    trustAnchorPath: "./config/mis/https-ca.crt"

    # Alternative initial HTTPS authentication material for the MIS.
    # Entries are SPKI SHA-256 pins in "sha256/<base64>" form (RFC 7469 §2.4).
    # Pinning a CA is preferred to pinning a leaf certificate. Endpoint identity
    # validation should still be performed when a pin matches.
    trustPins:
      - "sha256/6DtZYsyT+9vuAwfAKHCLpjQv2pQHCc9n7nnZsltwEU4="

    trustBundle:
      # Static SPIFFE Trust Bundle, formatted as a JWK Set (RFC 7517).
      # It supplies the principal's Trust Domain anchors and provides the bundle
      # floor when a refreshed bundle is unavailable.
      staticPath: "./config/mis/trust-bundle.json"

      # Direct Trust Bundle retrieval URI. When refresh is enabled, successful
      # retrievals replace the bundle currently held by the principal.
      # This is distinct from the discovery document URL below.
      uri: "https://mis.margo.org:9443/.well-known/spiffe/bundle.json"

    # MIS discovery document URL or the base URL consumed by the discovery client.
    # The discovered document supplies MIS-hosted locations, including the
    # Trust Bundle URI. The connection must be authenticated with trustAnchor
    # or trustPins unless system HTTPS trust is sufficient.
    discoveryDocumentURL: "https://mis.margo.org:9443/.well-known/margo"

    # Seconds between Trust Bundle refresh attempts.
    # Refreshing promptly limits the impact of missed trust-anchor rotations.
    cacheInterval: 60

wfm:
  # WFM endpoint for this WFM Client. This is routing information only;
  # the client's own identity and target wfm-id are read from its SVID.
  # Supply an absolute HTTPS URL.
  sbiUrl: https://symphony.machine:8084/v1alpha2/margo
stateSeeking:
  # How frequently the agent attempts to seek for the desired state from wfm
  # in seconds
  interval: 15

# Heuristics for choosing bundle download vs. individual manifest downloads.
# Both are optional; defaults are used when omitted.
bundle:
  # use the bundle when the manifest has more than 5(default) deployments
  deploymentThreshold: 5
  # Use the bundle when threshold for the size is greater than 50(default) in MB
  sizeThresholdMB: 50

# the workload-fleet-management-client architecture is kept in a way that it is capable of managing more than one runtimes
# but one client with multiple devices is not defined by Margo yet. For example: what would be the identification
# for the client and the device. Will WFM be aware of the client and devices? Etc...
# If this is needed please reach out to the Margo group and follow the formal approach of Margo for SUPs.
# For now, always keep one runtime in this section, and comment all other
runtimes:
  - type: KUBERNETES
    kubernetes:
      kubeconfigPath: /root/.kube/config
  # - type: DOCKER
  #   docker:
  #     url: unix:///var/run/docker.sock #http://localhost:8080 #unix://var/unix/socket
  #     tlsSkipVerification: true
  #     tls:
  #       cacertPath: null
  #       certPath: null
  #       keyPath: null

# Note: Auto-discovery of device capabilities is not defined and hence not implemented yet,
# hence you are supposed to provide the details
# in the file.
# Path to the capabilities file (required).
capabilities:
  readFromFile: ./config/capabilities.json
