name: Azure VM SSH Login

on:
  push:
    branches:
      - TestAutomation  # This workflow will be triggered when changes are pushed to the `dev` branch

jobs:
  ssh-login:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up environment variables from .env file
        run: |
          # Load environment variables from the .env file
          echo "Loading .env variables..."
          set -o allexport
          source .env
          set +o allexport

      - name: Install SSH client and sshpass
        run: sudo apt-get install -y openssh-client sshpass

      - name: Add VM's SSH key to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H $AZURE_VM_IP >> ~/.ssh/known_hosts

      - name: Log in to Azure VM using SSH
        run: |
          # Use sshpass to authenticate using username/password
          sshpass -p $AZURE_VM_PASSWORD ssh -o StrictHostKeyChecking=no $AZURE_VM_USERNAME@$AZURE_VM_IP "echo 'Logged in successfully!'"
